schema_version: 2
suite_id: implementation-08-private-before-v2

# Synthetic only. Copy this file into agent_harness/private/ and replace every
# value locally. The populated fixture and raw run must never be committed.
cases:
  - id: narrow-temporal-fact-example
    description: Synthetic narrow temporal fact
    turns:
      - input: When did the synthetic transition occur?
        expected:
          response_mode: traverse
          current_turn_subjects: [synthetic transition]
          resolved_referents: []
          required_operators: [temporal_retrieve]
          evidence_requirements: [chronology]
          answer: {exact_value: null, acceptable_values: [], resolution: bounded_or_exact}
          evidence_boundary:
            required_note_uuids: []
            acceptable_note_uuids: []
            answer_bearing_chunk_ids: []
            forbidden_note_uuids: []
            forbidden_inferences: [do_not_infer_a_date_from_context]
          negative_claim: {permitted: false, required_coverage: null}

