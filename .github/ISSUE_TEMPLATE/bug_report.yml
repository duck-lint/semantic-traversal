name: Bug report
description: Report a reproducible runtime, ingest, retrieval, or plugin defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove private vault content, API keys, personal paths, and sensitive artifacts before submitting.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and the command or interaction that produced it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include commands, sanitized configuration, and repeatable steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or branch
      placeholder: stable-runtime at <commit SHA>
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Python 3.11, Obsidian version, Ollama version
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Include relevant runtime outcome, coverage gaps, logs, or artifact excerpts.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets, private notes, and personal filesystem paths.
          required: true
