name: Architecture or research feedback
description: Propose a design change, evaluation, or documented failure case
title: "[Feedback]: "
labels:
  - feedback
body:
  - type: textarea
    id: observation
    attributes:
      label: What did you observe?
      description: Describe the concrete behavior, result, or limitation.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Which boundary or contract is involved?
      description: For example compiler schema, runtime authority, retrieval operator, selection, coverage, corpus design, or UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What change are you proposing?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What evidence would show improvement?
      description: Include measurements, fixtures, counterexamples, or a falsifiable acceptance criterion.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: What could weaken this proposal?
      description: Note tradeoffs, regressions, alternate explanations, or cases it may overfit.
