# The vault root is an environment-specific filesystem path supplied explicitly
# when a build is invoked. It is not stored in checked-in build configuration and
# does not participate in semantic identity.
#
# All canonical authored paths are vault-relative: only the path beneath the
# supplied vault root enters the semantic substrate.
#
# vault_name is a logical label only. It does not locate or validate the
# filesystem directory supplied at build invocation.
vault_name: kháos
uuid_field: uuid
excluded_folders:
  - VAULT DESIGN
semantic_identifier_fields:
  - note_type
  - tags
  - aliases
  - journal_entry_date
  - title
  - creator
  - book_read_today
  - layer
  - unity_level
  - vector_direction
  - register
  - register_mode
  - pillar
  - temporal_pace
  - hypnagogic_resonance
  - reactivity
  - racing_thoughts_while_awake
  - ran_script_when_racing
  - dream_motif
  - dream_motif_valence
  - dream_location
  - recall_ability
  - dream_lucidity
  - format
  - publish_studio
  - original_year_published
  - origin
  - entity
  - entity_type
  - canonical_name
  - relationship
  - first_met
  - birthday
