[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ugh-note-parser"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "markdown-it-py",
  "mdit-py-plugins",
  "ruamel.yaml",
  "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
