retrieval:
  max_chunks: 32
  scope_aliases:
    journal:
      note_type:
        - journal_entry
    personal_reflection:
      note_type:
        - journal_entry
  evidence_requirement_operators:
    literal_exhaustive: exact_chunk_search
    lexical_relevance: lexical_chunk_search
    semantic_similarity: vector_search
    graph_relation: graph_expand
    chronology: temporal_retrieve
  scope_policy:
    exact_request_mode: hard
    semantic_request_mode: preferred
  resource_inventory:
    schema_version: 1
    path_depth: 2
    max_values_per_facet: 32
    max_path_values: 128
    max_graph_types: 32
    max_temporal_types: 32
  exact:
    max_matches: 200
    context_chars: 240
  lexical:
    max_candidates: 100
    default_mode: any_tokens
  vector:
    max_candidates: 200
    min_similarity: 0.5
    per_query_max_candidates: 50
    max_chunks_per_note: 4
  graph:
    default_depth: 1
    max_depth: 2
    max_candidates: 24
  temporal:
    enabled: true
    max_candidates: 100
    default_limit: 24
    default_mode: earliest
    allowed_modes:
      - earliest
      - latest
      - before
      - after
      - between
      - ordered
    default_anchor_types:
      - journal_entry
    allowed_authorities:
      - explicit_primary
      - explicit_secondary
    include_conflicted_by_default: false
    field_mappings:
      journal_entry_date:
        anchor_type: journal_entry
        authority: explicit_primary
  planner_defaults:
    exact_limit: 200
    exact_return_total_count: true
    lexical_limit: 50
    vector_limit: 24
    graph_depth: 1
    selection_policy:
      max_chunks: 24
      preserve_required_layers: true
    claim_policy:
      negative_claims_require_exact_layer: true
runtime_conversation:
  stop_words: [a, an, and, are, as, at, be, but, by, about, do, for, from, how, i, if, in, into, is, it, my, of, "on", or, our, retrieve, retrieved, retrieves, retrieving, note, notes, regarding, search, the, find, found, locate, mention, mentions, show, to, with, you, your]
  referential_surface_words: [it, that, this, those, they, them]
  recent_semantic_turn_limit: 6
  recent_message_limit: 6
  visible_transcript_tail_limit: 6
  assistant_snippet_limit: 120
  raw_response_preview_limit: 1200

retrieval_scoring:
  exact_bonus: 4.0
  lexical_bonus: 2.0
  vector_bonus: 1.0
  graph_bonus: 1.5
  demotion_penalty: 10.0

graph_traversal:
  enabled: true
  direction: outbound
  max_candidates: 24
  seed_sources:
    - graph_seeds
    - semantic_queries
  edge_type_allowlist:
    - note_links_note
  node_type_allowlist:
    - note
  match_mode: "exact_or_token_overlap"
  min_token_overlap: 3

llm:
  model: "gpt-5.6-luna"
  reasoning:
    effort: medium
  max_output_tokens: 6000
  prompt_cache:
    enabled: true
    # Change this value when the stable instruction/packet prefix changes.
    key: "semantic-traversal-v0.1.1"
    retention: "24h"

semantic_compiler:
  provider: "ollama"
  model: qwen3:8b
  base_url: "http://localhost:11434"
  request_timeout_seconds: 120
  inventory_projection:
    max_chars: 12000
    low_cardinality_max_unique: 24
    max_values_per_field: 12
    max_path_values: 48

embeddings:
  provider: "sentence_transformers"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: null
  base_url: null
  batch_size: 32
  normalize_embeddings: true
  device: null
  request_timeout_seconds: 120

paths:
  vault_root: C:\Users\madis\Desktop\kháos
  data_root: ".semantic-traversal"
  vault_source_label: "vault"
  vault_exclude_globs:
    - ".semantic-traversal/**"
    - ".semantic-traversal-data/**"
    - ".obsidian/**"
    - "VAULT DESIGN/(.)MD TEMPLATES/**"
    - "VAULT DESIGN/ATTACHMENTS/**"
    - ".gitignore"
    - "vault.base"

prompts:
  semantic_compiler:
    template: |
      Return JSON only.
      Compile a semantic retrieval request for deterministic runtime resolution and retrieval execution. Do not answer the user.
      Do not emit planner_diagnostics; runtime adds diagnostics.
      Separate conversational meaning into scope alias requests, concepts, resolved referents, literal terms, semantic queries, lexical queries, and graph seeds.
      Declare evidence_requirements as an ordered, deduplicated list of supported constitutive evidence enums only: literal_exhaustive, lexical_relevance, semantic_similarity, graph_relation, or chronology. Use it to state what evidence is necessary for the interpreted request, not every optional surface that may help.
      Use only scope aliases present in the supplied resource inventory summary. Never emit raw note_type, path, source, author, book, or filesystem filters.
      Treat explicit search/find/list/mention/occurrence/count or absence requests as exact-search requests when possible. A quoted concept alone does not require exact search.
      For exact search, preserve each literal term, its requested case-sensitive or case-insensitive substring match mode, required flag, and return_total_count when exhaustive counts or absence are requested.
      Preserve lexical mode when the user requests a lexical operator. Preserve graph depth when traversal is explicit. Do not emit graph direction; runtime/YAML owns it.
      The top-level query must be human-readable retrieval text that preserves the principal subject. It must not be an identifier, slug, enum label, internal-looking name, or intent-only category. Semantic and lexical queries must preserve the target concept, entity, or resolved referent; intent words qualify the subject rather than replacing it. Do not emit bare origin, development, precursor, history, relation, comparison, or similar labels as retrieval queries.
      Graph seeds must name an actual concept, entity, note, or resolved referent. If no meaningful subject-bearing graph seed exists, leave graph_seeds empty. Temporal retrieval still requires subject-bearing lexical and/or semantic relevance queries; temporal ordering alone does not establish relevance.
      Request temporal retrieval when chronology, earliest/latest, before/after/between, development ordering, origin, precursors, what came before, or autobiographical development is constitutive of the question. For an origin or precursor question, use temporal_retrieve with an appropriate ordered/earliest mode and required true when chronology is necessary to answer; do not treat conceptual resemblance as chronology. Do not infer temporal retrieval from current, old, or history alone. Do not invent dates or causal influence.
      When the inventory presents an available alias for the requested autobiographical or chronological evidence, emit that alias in scope_requests; runtime decides whether it is hard or preferred.
      Requiredness is sparse: exact exhaustive search, strict temporal relations, and explicitly requested graph traversal may be required; otherwise prefer optional layers.
      Before returning JSON, self-audit that every constitutive evidentiary aspect of the interpreted intent appears in evidence_requirements and every declared evidence requirement has a corresponding requested retrieval operator. Do not answer the user or emit prose for this audit.
      The compiler requests operators and bounded limits only. Do not emit selection_policy, budgets, max_chunks, preserve_required_layers, claim_policy, coverage flags, or negative-claim permission.
      Conversation phrases such as "the two of them" are not corpus search terms; resolve them into referents from active_focus and recent_semantic_turns.
      Preserve the raw user input exactly.
      Use this exact canonical shape:
      {
        "raw_user_input": "",
        "intent": "",
        "query": "",
        "entities": [],
        "relations": [],
        "resolved_referents": [],
        "planner_retrieval_plan": {
          "intent_type": "semantic_traversal",
          "scope_requests": [],
          "concepts": [],
          "resolved_referents": [],
          "literal_terms": [],
          "evidence_requirements": [],
          "semantic_queries": [],
          "lexical_queries": [],
          "graph_seeds": [],
          "retrieval_layers": [
            {"operator": "lexical_chunk_search", "required": false, "limit": {semantic_compiler_lexical_limit}, "mode": "any_tokens"},
            {"operator": "vector_search", "required": false, "limit": {semantic_compiler_vector_limit}},
            {"operator": "graph_expand", "required": false, "depth": {semantic_compiler_graph_depth}}
          ]
        },
        "limitations": []
      }

      Generic request examples:
      - exact count: literal_terms with required true and return_total_count true;
      - broad conceptual: optional lexical and vector layers, no invented exact term;
      - graph relation: graph_expand with explicit seeds and requested depth;
      - temporal development: temporal_retrieve with mode ordered or earliest when chronology is constitutive;
      - preferred inventory alias: scope_requests containing an available alias, leaving hard/preferred binding to runtime;
      - narrow factual: concise semantic/vector request without unnecessary temporal or graph operators.
      - broad conceptual: evidence_requirements may include lexical_relevance and semantic_similarity when both forms of evidence are constitutive.
      - exhaustive occurrence/count/absence: evidence_requirements includes literal_exhaustive.
      - explicit relationship traversal: evidence_requirements includes graph_relation and retrieval_layers includes graph_expand.
      - origin, development, earliest/latest, before/after/between, or chronology: evidence_requirements includes chronology and retrieval_layers includes temporal_retrieve.
      - origin/development of concept X: use a subject-bearing top-level query, subject-bearing semantic and lexical queries, an available chronology scope alias when present, and a required temporal_retrieve layer with mode ordered or earliest; absence of a supplied date does not remove the need for temporal retrieval when chronology is the question.
      For that origin/development shape, do not emit an explicit empty lexical query list or omit an available matching scope alias merely because the target has no date in the user wording; use the inventory projection to request the available evidence surface.
      Subject-bearing query shapes:
      - concept X origin;
      - development of concept X;
      - earliest formulation of concept X;
      - relation between concept X and concept Y.
      Never use origin_of_idea, graph_relation, temporal_query, development, or precursor as the query by itself.

      Resource inventory summary:
      {resource_inventory_summary}

      Packet:
      {packet}
  frontier_synthesis:
    instructions: |
      You are a helpful assistant inside the semantic-traversal runtime.
      Use semantic_compiler_packet, synthesis_traversal_summary, and approved_retrieval_packet as runtime-bounded synthesis inputs.
      Respond directly to the user using the provided synthesis context packet only.
      Surface tension between the implicit/explicit semantic structure present in the provided synthesis context packet and the user message.
      If conversationally relevant, provide bounded inference claims with evidence linked to provided synthesis context packet.
      Do not describe retrieved notes as independently approved, verified, or authoritative.
      Do not invent retrieval results, exact-match counts, graph operations, or corpus coverage.
      Do not decide evidence validity or repair traversal, retrieval, or coverage.
      Never make corpus-wide negative claims unless approved_retrieval_packet.coverage.negative_claims_allowed is true.
      If exact search did not run, phrase absence claims as limited to the selected semantic retrieval packet.
      approved_retrieval_packet.selected_chunks is the only current-turn corpus passage evidence.
      synthesis_traversal_summary is execution and coverage metadata, not factual corpus evidence.
      Do not use compiler queries, inventory descriptions, counts, aliases, or diagnostics as substitute answer evidence.
      An exact completed-no-match result may support only the negative claim permitted by coverage.
      Answer directly from the runtime-bounded synthesis context.
      Prefer careful uncertainty over overconfident synthesis.

chunking:
  required_uuid_field: "uuid"
  max_chunk_chars: 2000
  semantic_frontmatter_fields:
    - note_type
    - tags
    - aliases
    - journal_entry_date
    - title
    - creator
    - book_read_today
    - uuid
    - layer
    - unity_level
    - vector_direction
    - register
    - register_mode
    - pillar
    - temporal_pace
    - hypnagogic_resonance
    - reactivity
    - racing_thoughts_while_awake
    - ran_script_when_racing
    - dream_motif
    - dream_motif_valence
    - dream_location
    - recall_ability
    - dream_lucidity
    - format
    - publish_studio
    - original_year_published
    - origin
    - entity
    - entity_type
    - canonical_name
    - relationship
    - first_met
    - birthday
  low_signal_apparatus:
    enabled: true
    skip_during_ingest: true
    skip_during_graph_representatives: true
    exact_lines:
      - "OXFORD"
      - "UNIVERSITY PRESS"
      - "OXFORD UNIVERSITY PRESS"
      - "Oxford University Press."
    prefixes:
      - "DOI"
      - "ISBN"
      - "Copyright"
      - "Published by"
      - "Printed in"
    contains:
      - "all rights reserved"
    short_all_caps_max_chars: 80

storage:
  threads_root: "threads"
  turns_root: "turns"
  turn_directory_prefix: "turn-"
  conversation_thread_filename: "conversation_thread.json"
  thread_state_filename: "thread_state.json"
  thread_ledger_filename: "thread_ledger.jsonl"
  ingestion_root: "ingestion"
  ingestion_database_filename: "latent_space.sqlite3"
  ingestion_manifests_root: "ingestion/manifests"
  latest_ingest_manifest_filename: "latest.json"

indexes:
  vector_table: "chunk_vectors"
  graph_nodes_table: "graph_nodes"
  graph_edges_table: "graph_edges"
