retrieval:
  max_chunks: 32
  scope_aliases:
    journal:
      note_type:
        - journal_entry
    personal_reflection:
      note_type:
        - journal_entry
  scope_policy:
    exact_request_mode: hard
    semantic_request_mode: preferred
  exact:
    max_matches: 200
    context_chars: 240
  lexical:
    max_candidates: 100
    default_mode: any_tokens
  vector:
    max_candidates: 200
    min_similarity: 0.5
    per_query_max_candidates: 50
    max_chunks_per_note: 4
  graph:
    default_depth: 1
    max_depth: 2
    max_candidates: 24
  temporal:
    enabled: true
    max_candidates: 100
    default_limit: 24
    allowed_modes:
      - earliest
      - latest
      - before
      - after
      - between
      - ordered
    default_anchor_types:
      - journal_entry
    allowed_authorities:
      - explicit_primary
      - explicit_secondary
    include_conflicted_by_default: false
    field_mappings:
      journal_entry_date:
        anchor_type: journal_entry
        authority: explicit_primary
  planner_defaults:
    exact_limit: 200
    exact_return_total_count: true
    lexical_limit: 50
    vector_limit: 24
    graph_depth: 1
    selection_policy:
      max_chunks: 24
      preserve_required_layers: true
    claim_policy:
      negative_claims_require_exact_layer: true
  compiler_compatibility:
    selection_policy_budgets:
      exact: 12
      lexical: 6
      vector: 6
      graph: 4

runtime_conversation:
  stop_words: [a, an, and, are, as, at, be, but, by, about, do, for, from, how, i, if, in, into, is, it, my, of, "on", or, our, retrieve, retrieved, retrieves, retrieving, note, notes, regarding, search, the, find, found, locate, mention, mentions, show, to, with, you, your]
  referential_surface_words: [it, that, this, those, they, them]
  recent_semantic_turn_limit: 6
  recent_message_limit: 6
  visible_transcript_tail_limit: 6
  assistant_snippet_limit: 120
  raw_response_preview_limit: 1200

retrieval_scoring:
  exact_bonus: 4.0
  lexical_bonus: 2.0
  vector_bonus: 1.0
  graph_bonus: 1.5
  demotion_penalty: 10.0

graph_traversal:
  enabled: true
  direction: outbound
  max_candidates: 24
  seed_sources:
    - graph_seeds
    - active_focus
    - semantic_queries
  edge_type_allowlist:
    - note_links_note
  node_type_allowlist:
    - note
  match_mode: "exact_or_token_overlap"
  min_token_overlap: 3

llm:
  model: "gpt-5.6-luna"
  reasoning:
    effort: medium
  max_output_tokens: 6000
  prompt_cache:
    enabled: true
    # Change this value when the stable instruction/packet prefix changes.
    key: "semantic-traversal-v0.1.1"
    retention: "24h"

semantic_compiler:
  provider: "ollama"
  model: qwen3:8b
  base_url: "http://localhost:11434"
  request_timeout_seconds: 120

embeddings:
  provider: "sentence_transformers"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dimensions: null
  base_url: null
  batch_size: 32
  normalize_embeddings: true
  device: null
  request_timeout_seconds: 120

paths:
  vault_root: C:\Users\madis\Desktop\kháos
  data_root: ".semantic-traversal"
  vault_source_label: "vault"
  vault_exclude_globs:
    - ".semantic-traversal/**"
    - ".semantic-traversal-data/**"
    - ".obsidian/**"
    - "VAULT DESIGN/(.)MD TEMPLATES/**"
    - "VAULT DESIGN/ATTACHMENTS/**"
    - ".gitignore"
    - "vault.base"

prompts:
  semantic_compiler:
    template: |
      Return JSON only.
      Compile a soft retrieval plan for deterministic resolution and retrieval execution. Do not answer the user.
      Do not emit planner_diagnostics; runtime adds diagnostics.
      Separate conversational meaning into distinct roles: scope requests, concepts, resolved referents, literal terms, semantic queries, lexical queries, and graph seeds.
      Treat search/find/list/mentions/occurrences requests as exact-search requests when possible.
      Treat words like journal or daily as soft scope requests when the user asks for journal material; do not emit note_type, path, or source filters.
      Conversation phrases such as "the two of them" are not corpus search terms; resolve them into referents from active_focus and recent_semantic_turns.
      Preserve the raw user input exactly.
      Use this exact canonical shape:
      {
        "raw_user_input": "",
        "intent": "",
        "query": "",
        "entities": [],
        "relations": [],
        "resolved_referents": [],
        "planner_retrieval_plan": {
          "intent_type": "semantic_traversal",
          "scope_requests": [],
          "concepts": [],
          "resolved_referents": [],
          "literal_terms": [],
          "semantic_queries": [],
          "lexical_queries": [],
          "graph_seeds": [],
          "retrieval_layers": [
            {"operator": "lexical_chunk_search", "required": false, "limit": {semantic_compiler_lexical_limit}},
            {"operator": "vector_search", "required": false, "limit": {semantic_compiler_vector_limit}},
            {"operator": "graph_expand", "required": false, "depth": {semantic_compiler_graph_depth}}
          ],
          "selection_policy": {"max_chunks": {semantic_compiler_max_chunks}, "preserve_required_layers": true, "budgets": {"exact": {semantic_compiler_exact_budget}, "lexical": {semantic_compiler_lexical_budget}, "vector": {semantic_compiler_vector_budget}, "graph": {semantic_compiler_graph_budget}}},
          "claim_policy": {"coverage_claims_allowed": false, "negative_claims_require_exact_layer": true}
        },
        "limitations": []
      }

      Packet:
      {packet}
  frontier_synthesis:
    instructions: |
      You are a helpful assistant inside the semantic-traversal runtime.
      Use semantic_compiler_packet, semantic_traversal_manifest, and approved_retrieval_packet as runtime-bounded synthesis inputs.
      Respond directly to the user using the provided synthesis context packet only.
      Surface tension between the implicit/explicit semantic structure present in the provided synthesis context packet and the user message.
      If conversationally relevant, provide bounded inference claims with evidence linked to provided synthesis context packet.
      Do not describe retrieved notes as independently approved, verified, or authoritative.
      Do not invent retrieval results, exact-match counts, graph operations, or corpus coverage.
      Do not decide evidence validity or repair traversal, retrieval, or coverage.
      Never make corpus-wide negative claims unless approved_retrieval_packet.coverage.negative_claims_allowed is true.
      If exact search did not run, phrase absence claims as limited to the selected semantic retrieval packet.
      Answer directly from the runtime-bounded synthesis context.
      Prefer careful uncertainty over overconfident synthesis.

chunking:
  required_uuid_field: "uuid"
  max_chunk_chars: 2000
  semantic_frontmatter_fields:
    - note_type
    - tags
    - aliases
    - journal_entry_date
    - title
    - creator
  low_signal_apparatus:
    enabled: true
    skip_during_ingest: true
    skip_during_graph_representatives: true
    exact_lines:
      - "OXFORD"
      - "UNIVERSITY PRESS"
      - "OXFORD UNIVERSITY PRESS"
      - "Oxford University Press."
    prefixes:
      - "DOI"
      - "ISBN"
      - "Copyright"
      - "Published by"
      - "Printed in"
    contains:
      - "all rights reserved"
    short_all_caps_max_chars: 80

storage:
  threads_root: "threads"
  turns_root: "turns"
  turn_directory_prefix: "turn-"
  conversation_thread_filename: "conversation_thread.json"
  thread_state_filename: "thread_state.json"
  thread_ledger_filename: "thread_ledger.jsonl"
  ingestion_root: "ingestion"
  ingestion_database_filename: "latent_space.sqlite3"
  ingestion_manifests_root: "ingestion/manifests"
  latest_ingest_manifest_filename: "latest.json"

indexes:
  vector_table: "chunk_vectors"
  graph_nodes_table: "graph_nodes"
  graph_edges_table: "graph_edges"
