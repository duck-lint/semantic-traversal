retrieval:
  max_chunks: 24

graph_traversal:
  enabled: true
  hop_limit: 2
  max_candidates: 24
  seed_sources:
    - graph_seeds
    - active_focus
    - retrieval_terms
  edge_type_allowlist:
    - note_links_note
  node_type_allowlist:
    - note
  match_mode: "exact_or_token_overlap"
  min_token_overlap: 3

llm:
  model: "gpt-5.4-mini"
  max_output_tokens: 6000

semantic_compiler:
  provider: "ollama"
  model: qwen3:8b
  base_url: "http://localhost:11434"
  request_timeout_seconds: 60

embeddings:
  provider: "sentence_transformers"
  model: "sentence-transformers/all-MiniLM-L6-v2"
  base_url: null
  batch_size: 32
  normalize_embeddings: true
  device: null
  request_timeout_seconds: 60

paths:
  vault_root: C:\Users\madis\Desktop\kháos
  data_root: ".semantic-traversal"
  vault_source_label: "vault"
  vault_exclude_globs:
    - ".semantic-traversal/**"
    - ".semantic-traversal-data/**"
    - ".obsidian/**"
    - "VAULT DESIGN/(.)MD TEMPLATES/**"
    - "VAULT DESIGN/ATTACHMENTS/**"
    - ".gitignore"
    - "vault.base"

prompts:
  semantic_compiler:
    template: |
      Return JSON only.
      Compile a minimal semantic target for traversal. Do not answer the user.
      Prefer precise traversal terms over broad abstractions.
      Use active_focus and recent_semantic_turns to resolve referential follow-ups.
      For words like it, that, this, those, they, or them, prefer the current active focus unless contradicted by the raw user input.
      Preserve the raw user input exactly.
      Use this exact canonical shape:
      {
        "raw_user_input": "",
        "intent": "",
        "query": "",
        "entities": [],
        "relations": [],
        "resolved_referents": [],
        "retrieval_terms": [],
        "vector_query": "",
        "graph_seeds": [],
        "limitations": []
      }

      Packet:
      {packet}
  frontier_synthesis:
    instructions: |
      You are a helpful assistant inside the semantic-traversal runtime.
      Respond directly to the user using the provided synthesis context packet only.
      Use semantic_compiler_packet and the approved_retrieval_packet field as runtime-bounded synthesis inputs.
      Do not describe retrieved notes as independently approved, verified, or authoritative.
      Do not invent retrieval results or graph operations.
      Do not decide evidence validity or repair traversal, retrieval, or coverage.
      Answer directly from the runtime-bounded synthesis context.
      Prefer careful uncertainty over overconfident synthesis.

chunking:
  required_uuid_field: "uuid"
  max_chunk_chars: 2000
  semantic_frontmatter_fields:
    - tags
    - aliases
    - journal_entry_date

storage:
  threads_root: "threads"
  turns_root: "turns"
  turn_directory_prefix: "turn-"
  conversation_thread_filename: "conversation_thread.json"
  thread_state_filename: "thread_state.json"
  thread_ledger_filename: "thread_ledger.jsonl"
  ingestion_root: "ingestion"
  ingestion_database_filename: "latent_space.sqlite3"
  ingestion_manifests_root: "ingestion/manifests"
  latest_ingest_manifest_filename: "latest.json"

indexes:
  vector_table: "chunk_vectors"
  graph_nodes_table: "graph_nodes"
  graph_edges_table: "graph_edges"
